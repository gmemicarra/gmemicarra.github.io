<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="google-site-verification" content="qy2rNu64uJOT1RYDeC06Ib03me_DUPS8xaE6sydh-C8" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamer Mind</title>
	<link rel="icon" type="image/png" href="favicon.png">
    <style>
        body,html {
            font-family: Arial, sans-serif;
            text-align: center;
			background: linear-gradient(to bottom, #152F77, #050F2C);
            margin: 0;
            padding: 0;
			min-height: 100%;
        }
        h1 {
            margin: 0;
			padding-top: 75px;
            color: #FFFFFF;
			font-size: 48px;
        }
        .button-container {
            margin-top: 50px;
			padding-bottom: 80px;
        }
        a.button {
            display: inline-block;
            text-decoration: none;
            background-color: #1453FF;
            color: #FFFFFF;
            padding: 12px 25px;
            margin: 10px;
            border-radius: 8px;
            font-size: 18px;
            transition: background-color 0.3s;
        }
        a.button:hover {
            background-color: #003FEB;
        }
		.game-button {
			text-align: center;
			display: flex;
			flex-direction: column;
			align-items: center;
			margin-bottom: 30px;
		}
		.thumbnail {
			width: 180px;
			height: 100px;
			object-fit: cover;
			border-radius: 12px;
			margin-bottom: 10px;
		}
		/* Contenedor flotante en la esquina inferior derecha */
		.footer-links {
			position: fixed;
			bottom: 10px;
			right: 10px;
			display: flex;
			align-items: center;
			gap: 10px;
			z-index: 1000;
		}
		.contacto {
			background-color: rgba(0, 0, 0, 0.5);
			color: white;
			padding: 10px 15px;
			border-radius: 5px;
			text-decoration: none;
			font-size: 14px;
			transition: background-color 0.3s;
		}
		.contacto:hover {
			background-color: rgba(0, 0, 0, 0.8);
		}
		.social-button {
		  display: inline-flex;
		  align-items: center;
		  justify-content: center;
		  background-color: #1453FF;
		  border-radius: 50%;
		  width: 40px;
		  height: 40px;
		  text-decoration: none;
		  transition: transform 0.2s, background-color 0.2s;
		}
		.social-button:hover {
		  transform: scale(1.1);
		  background-color: #C13584;
		}
    </style>
</head>
<body>
    <h1>Gamer Mind</h1>
    <div class="button-container">
		<div class="game-button">
			<img src="wotu.png" alt="Warriors of the Universe" class="thumbnail">
			<a class="button" href="https://play.google.com/store/apps/details?id=com.GamerMind.Warriors_of_the_Universe_Online" target="_blank">Warriors of the Universe</a>
		</div>
		<div class="game-button">
			<img src="legendsrpg.png" alt="Legends RPG" class="thumbnail">
			<a class="button" href="https://play.google.com/store/apps/details?id=com.gamermind.woturpg" target="_blank">Legends RPG</a>
		</div>
    </div>

	<!-- Pie de página con Contact, Terms of Service e Instagram -->
	<div class="footer-links">
		<a href="terms.html" class="contacto">Terms of Service</a>
		<a href="mailto:gmemicarra@gmail.com" class="contacto">Contact</a>
		<a href="https://instagram.com/gamermind_ig" target="_blank" class="social-button" title="Instagram">

			</svg>
		</a>
	</div>
</body>
</html>
